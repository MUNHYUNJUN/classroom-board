<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>학급 디지털 게시판</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F2F1EE; --surface:#FFF; --border:#E4E2DC;
    --text-primary:#1A1A1A; --text-secondary:#6B6860; --text-muted:#AAA89F;
    --accent:#2D5BE3; --accent-soft:#EEF2FD;
    --red:#D94F3D; --green:#2A7A52; --green-soft:#E8F5EE;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);font-family:"Noto Sans KR",sans-serif;color:var(--text-primary);height:calc(var(--vh,1vh) * 100);height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;}

  /* ── 헤더 ── */
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:13px 36px;background:var(--surface);border-bottom:1px solid var(--border);}
  .school-name{font-size:11px;font-weight:500;color:var(--text-secondary);letter-spacing:.06em;}
  .class-name{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-top:1px;}
  .header-center{text-align:center;}
  .board-title{font-size:clamp(26px,3.2vw,42px);font-weight:900;letter-spacing:-.03em;line-height:1;}
  .board-title-sub{margin-top:5px;display:flex;align-items:center;justify-content:center;gap:5px;}
  .live-dot{display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .live-label{font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;}
  .datetime-block{text-align:right;}
  #clock{font-family:"DM Mono",monospace;font-size:24px;font-weight:400;letter-spacing:-.02em;}
  #date{font-size:11px;color:var(--text-secondary);margin-top:2px;}

  /* ── 메인 ── */
  main{display:grid;grid-template-columns:1fr 2fr;gap:13px;padding:13px 30px;overflow:hidden;min-height:0;}
  .left-col{display:grid;grid-template-rows:1.05fr minmax(0,260px) 1fr;gap:11px;min-height:0;}
  .mid-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;min-height:0;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 19px;display:flex;flex-direction:column;overflow:hidden;}
  .meal-card{padding:13px 16px;}
  .card-label{font-size:clamp(17px,1.35vw,23px);font-weight:900;letter-spacing:-.02em;margin-bottom:10px;flex-shrink:0;}

  /* ── D-Day ── */
  .card-dday{background:var(--text-primary);border-color:var(--text-primary);color:#fff;flex-direction:row;align-items:stretch;padding:18px 26px;}
  .dday-main{display:flex;flex-direction:column;justify-content:center;padding-right:26px;margin-right:26px;border-right:1px solid rgba(255,255,255,.1);flex-shrink:0;}
  .dday-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:4px;}
  .dday-label-txt{font-size:clamp(15px,1.2vw,20px);font-weight:900;letter-spacing:-.02em;color:rgba(255,255,255,.45);}
  .dday-edit-btn{font-size:9px;font-weight:700;color:rgba(255,255,255,.55);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:2px 8px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .dday-edit-btn:hover{background:rgba(255,255,255,.2);color:#fff;}
  .dday-event{font-size:clamp(12px,.95vw,15px);color:rgba(255,255,255,.45);margin-bottom:5px;white-space:nowrap;}
  .dday-number{font-family:"DM Mono",monospace;font-size:clamp(54px,4.9vw,90px);font-weight:300;line-height:1;letter-spacing:-.04em;white-space:nowrap;}
  .dday-number .pre{font-size:.36em;font-weight:500;vertical-align:super;color:rgba(255,255,255,.4);}
  .dday-sub{font-family:"DM Mono",monospace;font-size:clamp(11px,.85vw,14px);color:rgba(255,255,255,.3);margin-top:8px;}
  .dday-list{display:flex;flex-direction:column;justify-content:center;gap:7px;flex:1;}
  .dday-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 15px;background:rgba(255,255,255,.05);border-radius:9px;border:1px solid rgba(255,255,255,.07);}
  .dday-item-name{font-size:clamp(13px,1.05vw,17px);font-weight:500;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dday-item-count{font-family:"DM Mono",monospace;font-size:clamp(19px,1.5vw,26px);color:#fff;flex-shrink:0;}

  /* ── 급식(중식/석식 공통) ── */
  .meal-card{position:relative;}
  .meal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;flex-shrink:0;}
  .meal-header .card-label{margin-bottom:0;}
  .meal-day{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;font-family:"DM Mono",monospace;}
  .meal-list{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;max-height:188px;overflow-y:auto;}
  .meal-list::-webkit-scrollbar{width:3px;}
  .meal-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .meal-item{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg);border-radius:6px;font-size:12px;line-height:1.35;flex-shrink:0;}
  .meal-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
  .meal-kcal{text-align:center;margin-top:4px;font-size:10px;color:var(--text-muted);font-family:"DM Mono",monospace;flex-shrink:0;}
  .meal-empty{color:var(--text-muted);font-size:11px;padding:5px 8px;}
  .meal-edit-btn{position:absolute;top:12px;right:13px;font-size:9px;font-weight:700;border-radius:5px;padding:2px 7px;cursor:pointer;opacity:0;transition:opacity .2s;}
  .meal-card:hover .meal-edit-btn{opacity:1;}

  .card-lunch .card-label{color:var(--green);}
  .card-lunch .meal-day{color:var(--green);background:var(--green-soft);}
  .card-lunch .meal-dot{background:var(--green);}
  .card-lunch .meal-edit-btn{color:var(--green);background:var(--green-soft);border:1px solid #B8DDD0;}

  .card-dinner .card-label{color:var(--accent);}
  .card-dinner .meal-day{color:var(--accent);background:var(--accent-soft);}
  .card-dinner .meal-dot{background:var(--accent);}
  .card-dinner .meal-edit-btn{color:var(--accent);background:var(--accent-soft);border:1px solid #C8D8F8;}

  /* ── 공지사항 ── */
  .card-notice .card-label{color:var(--accent);}
  .notice-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .notice-header .card-label{margin-bottom:0;}
  .notice-add-btn{font-size:9px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid #C8D8F8;border-radius:5px;padding:2px 8px;cursor:pointer;}
  .notice-add-btn:hover{background:#DDE8FB;}
  .notice-list{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;}
  .notice-item{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;background:var(--accent-soft);border-radius:9px;border-left:3px solid var(--accent);flex-shrink:0;}
  .notice-badge{font-size:9px;font-weight:700;background:var(--accent);color:#fff;padding:2px 6px;border-radius:3px;white-space:nowrap;margin-top:1px;flex-shrink:0;}
  .notice-item-inner{flex:1;min-width:0;}
  .notice-text{font-size:13px;line-height:1.5;}
  .notice-date{font-size:10px;color:var(--text-muted);margin-top:3px;font-family:"DM Mono",monospace;}
  .notice-del-btn{font-size:11px;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:0 2px;flex-shrink:0;margin-top:1px;}
  .notice-del-btn:hover{color:var(--red);}

  /* ── 수시일정 ── */
  .schedule-panel{background:var(--surface);border:1px solid var(--border);border-radius:13px;display:flex;flex-direction:column;overflow:hidden;}
  .schedule-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .schedule-label{font-size:clamp(19px,1.5vw,26px);font-weight:900;letter-spacing:-.02em;color:var(--accent);}
  .schedule-today{font-size:11px;color:var(--text-secondary);font-family:"DM Mono",monospace;margin-top:2px;}
  .schedule-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
  .schedule-range{display:flex;align-items:center;gap:6px;}
  .range-btn{font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid #C8D8F8;border-radius:5px;padding:2px 8px;cursor:pointer;}
  .range-btn:hover{background:#DDE8FB;}
  .range-info{font-size:10px;color:var(--text-muted);font-family:"DM Mono",monospace;}
  .schedule-filter{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
  .filter-btn{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--text-secondary);}
  .filter-btn.active{color:#fff;border-color:transparent;background:var(--accent);}
  .schedule-body{flex:1;overflow-y:auto;padding:10px 14px;}
  .schedule-body::-webkit-scrollbar{width:4px;}
  .schedule-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .day-group{margin-bottom:14px;}
  .day-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;position:sticky;top:0;background:var(--surface);padding:4px 0;z-index:1;}
  .day-label{font-size:14px;font-weight:700;font-family:"DM Mono",monospace;}
  .day-label.today-label{color:var(--accent);}
  .today-badge{font-size:9px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:3px;font-weight:700;margin-left:4px;}
  .day-count{font-size:10px;color:var(--text-muted);background:var(--bg);padding:1px 7px;border-radius:10px;}
  .day-divider{flex:1;height:1px;background:var(--border);}
  .sched-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:5px;}
  .sched-item{display:flex;align-items:flex-start;gap:8px;padding:7px 11px;border-radius:8px;border-left:3px solid transparent;}
  .sched-cat{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;color:#fff;white-space:nowrap;flex-shrink:0;margin-top:2px;}
  .sched-info{flex:1;min-width:0;}
  .sched-univ{font-size:13px;font-weight:600;}
  .sched-detail{font-size:11px;color:var(--text-secondary);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .no-schedule{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--text-muted);}
  .no-schedule-icon{font-size:32px;opacity:.25;}
  .no-schedule-text{font-size:13px;}

  .sched-item[data-cat="원서접수마감"]{border-color:#D94F3D;background:#FDF0EE;}
  .sched-item[data-cat="서류마감"]{border-color:#E07B2A;background:#FDF5EC;}
  .sched-item[data-cat="추천명단마감"]{border-color:#C2410C;background:#FDF2EC;}
  .sched-item[data-cat="1단계합격"]{border-color:#2D5BE3;background:#EEF2FD;}
  .sched-item[data-cat="면접"]{border-color:#2A7A52;background:#E8F5EE;}
  .sched-item[data-cat="논술"]{border-color:#7C3AED;background:#F3EFFE;}
  .sched-item[data-cat="실기"]{border-color:#B07028;background:#FBF3E6;}
  .sched-item[data-cat="최종합격"]{border-color:#1A1A1A;background:#F4F4F2;}
  .sched-item[data-cat="충원합격"]{border-color:#0E7490;background:#ECF7FA;}
  .sched-item[data-cat="수능"]{border-color:#DC2626;background:#FEF2F2;}
  .sched-cat[data-cat="원서접수마감"]{background:#D94F3D;}
  .sched-cat[data-cat="서류마감"]{background:#E07B2A;}
  .sched-cat[data-cat="추천명단마감"]{background:#C2410C;}
  .sched-cat[data-cat="1단계합격"]{background:#2D5BE3;}
  .sched-cat[data-cat="면접"]{background:#2A7A52;}
  .sched-cat[data-cat="논술"]{background:#7C3AED;}
  .sched-cat[data-cat="실기"]{background:#B07028;}
  .sched-cat[data-cat="최종합격"]{background:#1A1A1A;}
  .sched-cat[data-cat="충원합격"]{background:#0E7490;}
  .sched-cat[data-cat="수능"]{background:#DC2626;}

  /* ── 티커 ── */
  footer{background:var(--surface);border-top:1px solid var(--border);padding:8px 36px;display:flex;align-items:center;overflow:hidden;}
  .ticker-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--accent);padding:3px 10px;border-radius:4px;margin-right:18px;white-space:nowrap;flex-shrink:0;}
  .ticker-wrap{flex:1;overflow:hidden;}
  .ticker-track{display:flex;gap:56px;animation:ticker 32s linear infinite;white-space:nowrap;}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .ticker-item{font-size:12px;color:var(--text-secondary);flex-shrink:0;}
  .ticker-sep{color:var(--border);margin:0 6px;}

  /* ── 전체화면 버튼 ── */
  #fs-btn{position:fixed;right:14px;bottom:52px;z-index:250;
    width:46px;height:46px;border-radius:50%;border:1px solid var(--border);
    background:rgba(255,255,255,.82);color:var(--text-secondary);
    font-size:19px;line-height:1;cursor:pointer;opacity:.35;
    transition:opacity .2s, background .2s;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.10);}
  #fs-btn:hover,#fs-btn:active{opacity:1;background:#fff;}
  body.is-fs #fs-btn{opacity:.18;}
  body.is-fs #fs-btn:hover,body.is-fs #fs-btn:active{opacity:1;}

  /* ── 모달 ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:300;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:18px;padding:26px 26px 22px;width:420px;max-width:93vw;}
  .modal-title{font-size:15px;font-weight:700;margin-bottom:3px;}
  .modal-sub{font-size:11px;color:var(--text-muted);margin-bottom:16px;}
  .modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
  .modal-box textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-family:"Noto Sans KR",sans-serif;font-size:13px;line-height:1.7;resize:none;outline:none;background:var(--bg);}
  .modal-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .modal-row label{font-size:11px;color:var(--text-secondary);white-space:nowrap;}
  .modal-row input{flex:1;border:1px solid var(--border);border-radius:7px;padding:6px 11px;font-size:12px;outline:none;background:var(--bg);font-family:"DM Mono",monospace;}
  .btn-cancel{padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:var(--text-secondary);}
  .btn-cancel:hover{background:var(--bg);}
  .btn-save{padding:7px 20px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;}
  .btn-green{background:var(--green);}
  .btn-accent{background:var(--accent);}
  .btn-dark{background:var(--text-primary);}
  .badge-row{display:flex;gap:10px;margin-bottom:12px;}
  .badge-opt{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;font-weight:500;}
  .badge-opt input{accent-color:var(--accent);}
  .dday-section-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;margin-top:14px;}
  .dday-section-lbl:first-of-type{margin-top:0;}
  .dday-input-row{display:grid;grid-template-columns:1fr 148px 52px;gap:7px;align-items:center;margin-bottom:8px;}
  .dday-input-row input{border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;outline:none;background:var(--bg);width:100%;font-family:"Noto Sans KR",sans-serif;}
  .dday-input-row input[type=date]{font-family:"DM Mono",monospace;font-size:12px;padding:7px 8px;}
  .dday-preview{font-family:"DM Mono",monospace;font-size:13px;font-weight:700;color:var(--accent);text-align:center;}
  hr.dday-divider{border:none;border-top:1px solid var(--border);margin:12px 0 4px;}
</style>
</head>
<body>

<header>
  <div>
    <div class="school-name">대진여자고등학교</div>
    <div class="class-name">3학년 11반</div>
  </div>
  <div class="header-center">
    <div class="board-title">학급 게시판</div>
    <div class="board-title-sub"><span class="live-dot"></span><span class="live-label">Live</span></div>
  </div>
  <div class="datetime-block">
    <div id="clock">00:00:00</div>
    <div id="date">로딩 중...</div>
  </div>
</header>

<main>
  <div class="left-col">

    <!-- D-Day -->
    <div class="card card-dday">
      <div class="dday-main">
        <div class="dday-top-row">
          <span class="dday-label-txt">수능 D-Day</span>
          <button class="dday-edit-btn" onclick="openDdayModal()">✏ 편집</button>
        </div>
        <div class="dday-event" id="dday-event-name">2027학년도 수능</div>
        <div class="dday-number">
          <span class="pre" id="dday-prefix">D-</span><span id="dday-num">---</span>
        </div>
        <div class="dday-sub" id="dday-date-display"></div>
      </div>
      <div class="dday-list">
        <div class="dday-item">
          <span class="dday-item-name" id="sub1-name">-</span>
          <span class="dday-item-count" id="sub1-count">-</span>
        </div>
        <div class="dday-item">
          <span class="dday-item-name" id="sub2-name">-</span>
          <span class="dday-item-count" id="sub2-count">-</span>
        </div>
        <div class="dday-item">
          <span class="dday-item-name" id="sub3-name">-</span>
          <span class="dday-item-count" id="sub3-count">-</span>
        </div>
      </div>
    </div>

    <!-- 중식 + 석식 -->
    <div class="mid-row">
      <div class="card meal-card card-lunch">
        <button class="meal-edit-btn" onclick="openMealModal('lunch')">✏ 편집</button>
        <div class="meal-header">
          <div class="card-label">오늘의 중식</div>
          <div class="meal-day" id="lunch-day">오늘</div>
        </div>
        <div class="meal-list" id="lunch-grid">
          <div class="meal-empty">불러오는 중…</div>
        </div>
        <div class="meal-kcal" id="lunch-kcal"></div>
      </div>

      <div class="card meal-card card-dinner">
        <button class="meal-edit-btn" onclick="openMealModal('dinner')">✏ 편집</button>
        <div class="meal-header">
          <div class="card-label">오늘의 석식</div>
          <div class="meal-day" id="dinner-day">오늘</div>
        </div>
        <div class="meal-list" id="dinner-grid">
          <div class="meal-empty">불러오는 중…</div>
        </div>
        <div class="meal-kcal" id="dinner-kcal"></div>
      </div>
    </div>

    <!-- 공지사항 -->
    <div class="card card-notice">
      <div class="notice-header">
        <div class="card-label">공지사항</div>
        <button class="notice-add-btn" onclick="openNoticeModal()">+ 공지 추가</button>
      </div>
      <div class="notice-list" id="notice-list"></div>
    </div>

  </div>

  <!-- 수시일정 -->
  <div class="schedule-panel">
    <div class="schedule-toolbar">
      <div>
        <div class="schedule-label">2027 수시 일정</div>
        <div class="schedule-today" id="schedule-today-info"></div>
      </div>
      <div class="schedule-right">
        <div class="schedule-range">
          <button class="range-btn" onclick="changeRange(-7)">◀ 이전</button>
          <span class="range-info" id="range-info"></span>
          <button class="range-btn" onclick="changeRange(7)">다음 ▶</button>
        </div>
        <div class="schedule-filter">
          <button class="filter-btn active" data-cat="all" onclick="toggleFilter('all')">전체</button>
          <button class="filter-btn" data-cat="원서접수마감" onclick="toggleFilter('원서접수마감')">원서</button>

<script>
'use strict';

/* =====================================================
   ★ 구글 시트 주소 (여기만 바꾸면 됩니다)
   ===================================================== */
var SHEET_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQj5B0CsHrYNyFlDCtQuaN3KboIz01TJvzLxitzr6sfZ5eOFMERsWNKJRig8YmcURuIJHBW_GCCN6u/pub';
var LUNCH_CSV  = SHEET_BASE + '?gid=0&single=true&output=csv';          // 오늘의 중식
var DINNER_CSV = SHEET_BASE + '?gid=33880123&single=true&output=csv';   // 오늘의 석식
var NOTICE_CSV = SHEET_BASE + '?gid=584526684&single=true&output=csv';  // 공지
var DDAY_CSV   = SHEET_BASE + '?gid=548968173&single=true&output=csv';  // Dday

/* 파일 버전 — 올리면 모든 기기 저장값이 초기화됩니다 */
var FILE_VERSION = 'v27';
try {
  if (localStorage.getItem('file_version') !== FILE_VERSION) {
    localStorage.clear();
    localStorage.setItem('file_version', FILE_VERSION);
  }
} catch (e) {}

var WD = ['일','월','화','수','목','금','토'];

/* 전자칠판·모바일에서 100vh가 실제 화면보다 크게 잡혀
   아래가 잘리는 문제 방지 — 진짜 보이는 높이를 재서 반영 */
function fixViewportHeight(){
  var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty('--vh', (h / 100) + 'px');
}
fixViewportHeight();
window.addEventListener('resize', fixViewportHeight);
window.addEventListener('orientationchange', function(){ setTimeout(fixViewportHeight, 300); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fixViewportHeight);

/* =====================================================
   공통 유틸
   ===================================================== */
function pad2(n){ return ('0' + n).slice(-2); }

function todayStr(){
  var n = new Date();
  return n.getFullYear() + '-' + pad2(n.getMonth()+1) + '-' + pad2(n.getDate());
}

/* 2026.8.27 / 2026-8-27 / 2026/08/27 → 2026-08-27 */
function normDate(s){
  if (!s) return '';
  s = String(s).trim();
  var m = s.match(/^([0-9]{4})[-.\/]([0-9]{1,2})[-.\/]([0-9]{1,2})$/);
  if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  return s;
}

/* 따옴표 포함 CSV 한 줄을 정확히 쪼갬 */
function parseCSVLine(line){
  var out = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++){
    var ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { out.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  out.push(cur.trim());
  return out;
}

function fetchCSV(url){
  return fetch(url + '&t=' + Date.now())
    .then(function(r){ return r.text(); })
    .then(function(txt){
      return txt.replace(/\r/g,'').trim().split('\n').map(parseCSVLine);
    });
}

function calcD(dateStr){
  if (!dateStr) return '';
  var t = new Date(); t.setHours(0,0,0,0);
  var diff = Math.round((new Date(dateStr + 'T00:00:00') - t) / 86400000);
  if (diff > 0)  return 'D-' + diff;
  if (diff === 0) return 'D-Day';
  return 'D+' + Math.abs(diff);
}

/* =====================================================
   0. 전체화면 (키보드 없이 터치로)
   ===================================================== */
function toggleFullscreen(){
  var el = document.documentElement;
  var isFs = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (!isFs){
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch(e){}
}

function syncFsState(){
  var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.body.classList.toggle('is-fs', isFs);
  var btn = document.getElementById('fs-btn');
  if (btn) btn.textContent = isFs ? '⤡' : '⛶';
  if (typeof fixViewportHeight === 'function') setTimeout(fixViewportHeight, 120);
}
document.addEventListener('fullscreenchange', syncFsState);
document.addEventListener('webkitfullscreenchange', syncFsState);

/* =====================================================
   1. 시계
   ===================================================== */
function tick(){
  var n = new Date();
  var wd = WD[n.getDay()];
  document.getElementById('clock').textContent =
    pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds());
  document.getElementById('date').textContent =
    n.getFullYear() + '년 ' + (n.getMonth()+1) + '월 ' + n.getDate() + '일 (' + wd + ')';
  var label = (n.getMonth()+1) + '/' + n.getDate() + ' (' + wd + ')';
  document.getElementById('lunch-day').textContent = label;
  document.getElementById('dinner-day').textContent = label;
}
setInterval(tick, 1000);
tick();

/* =====================================================
   2. 급식 (중식 / 석식)
   ===================================================== */
var mealEditTarget = 'lunch';

function renderMeal(kind, items, kcal){
  var grid = document.getElementById(kind + '-grid');
  var kcalEl = document.getElementById(kind + '-kcal');
  if (!items || !items.length){
    grid.innerHTML = '<div class="meal-empty">급식 정보가 없습니다</div>';
    kcalEl.textContent = '';
  } else {
    grid.innerHTML = items.map(function(m){
      return '<div class="meal-item"><div class="meal-dot"></div>' + m + '</div>';
    }).join('');
    kcalEl.textContent = kcal ? '열량: ' + kcal : '';
  }
  renderTicker();
}

/* 시트 한 장에서 오늘 날짜 행을 찾아 메뉴/열량 추출
   A열=날짜, B열~=메뉴, 마지막 열이 Kcal이면 열량으로 분리 */
function pickTodayMeal(rows){
  var today = todayStr();
  for (var i = 1; i < rows.length; i++){
    var cols = rows[i];
    if (normDate(cols[0]) !== today) continue;
    var last = cols[cols.length-1] || '';
    var isKcal = /[0-9]/.test(last) && /kcal|칼로리/i.test(last);
    var end = isKcal ? cols.length - 1 : cols.length;
    return { items: cols.slice(1, end).filter(Boolean), kcal: isKcal ? last : '' };
  }
  return null;
}

function loadMeal(kind, url){
  fetchCSV(url).then(function(rows){
    var r = pickTodayMeal(rows);
    if (r && r.items.length) {
      renderMeal(kind, r.items, r.kcal);
      try {
        localStorage.setItem('meal_' + kind, JSON.stringify(r.items));
        localStorage.setItem('meal_' + kind + '_kcal', r.kcal);
        localStorage.setItem('meal_' + kind + '_date', todayStr());
      } catch(e){}
    } else {
      loadSavedMeal(kind);
    }
  }).catch(function(){ loadSavedMeal(kind); });
}

function loadSavedMeal(kind){
  try {
    if (localStorage.getItem('meal_' + kind + '_date') === todayStr()){
      var items = JSON.parse(localStorage.getItem('meal_' + kind) || '[]');
      if (items.length){
        renderMeal(kind, items, localStorage.getItem('meal_' + kind + '_kcal') || '');
        return;
      }
    }
  } catch(e){}
  renderMeal(kind, [], '');
}

function openMealModal(kind){
  mealEditTarget = kind;
  document.getElementById('meal-modal-title').textContent =
    (kind === 'lunch' ? '오늘의 중식 편집' : '오늘의 석식 편집');
  var saved = [];
  try { saved = JSON.parse(localStorage.getItem('meal_' + kind) || '[]'); } catch(e){}
  document.getElementById('meal-input').value = saved.join('\n');
  document.getElementById('meal-kcal-input').value =
    localStorage.getItem('meal_' + kind + '_kcal') || '';
  document.getElementById('meal-modal').classList.add('open');
}

function closeMealModal(){
  document.getElementById('meal-modal').classList.remove('open');
}

function saveMeal(){
  var items = document.getElementById('meal-input').value
    .split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var kcal = document.getElementById('meal-kcal-input').value.trim();
  try {
    localStorage.setItem('meal_' + mealEditTarget, JSON.stringify(items));
    localStorage.setItem('meal_' + mealEditTarget + '_kcal', kcal);
    localStorage.setItem('meal_' + mealEditTarget + '_date', todayStr());
  } catch(e){}
  renderMeal(mealEditTarget, items, kcal);
  closeMealModal();
}

document.getElementById('meal-modal').addEventListener('click', function(e){
  if (e.target === this) closeMealModal();
});

loadMeal('lunch', LUNCH_CSV);
loadMeal('dinner', DINNER_CSV);
setInterval(function(){
  loadMeal('lunch', LUNCH_CSV);
  loadMeal('dinner', DINNER_CSV);
}, 30 * 60 * 1000);

/* =====================================================
   3. 공지사항
   ===================================================== */
var NOTICE_DEFAULT = [];

function getNotices(){
  try {
    var s = localStorage.getItem('notices');
    return s ? JSON.parse(s) : NOTICE_DEFAULT;
  } catch(e){ return NOTICE_DEFAULT; }
}

function renderNotices(){
  var list = document.getElementById('notice-list');
  var notices = getNotices();
  if (!notices.length){
    list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px 0">공지사항이 없습니다</div>';
  } else {
    list.innerHTML = notices.map(function(n, i){
      return '<div class="notice-item">'
        + '<div class="notice-badge">' + n.badge + '</div>'
        + '<div class="notice-item-inner">'
        +   '<div class="notice-text">' + n.text + '</div>'
        +   '<div class="notice-date">' + (n.date || '') + '</div>'
        + '</div>'
        + '<button class="notice-del-btn" onclick="deleteNotice(' + i + ')">✕</button>'
        + '</div>';
    }).join('');
  }
  renderTicker();
}

function deleteNotice(idx){
  var notices = getNotices();
  notices.splice(idx, 1);
  try { localStorage.setItem('notices', JSON.stringify(notices)); } catch(e){}
  renderNotices();
}

function loadNotices(){
  fetchCSV(NOTICE_CSV).then(function(rows){
    var notices = [];
    for (var i = 1; i < rows.length; i++){
      var c = rows[i];
      if (c[1]) notices.push({ badge: c[0] || '안내', text: c[1], date: c[2] || '' });
    }
    if (notices.length){
      try { localStorage.setItem('notices', JSON.stringify(notices)); } catch(e){}
      renderNotices();
    }
  }).catch(function(){});
}

function openNoticeModal(){
  var n = new Date();
  document.getElementById('notice-input').value = '';
  document.getElementById('notice-date-input').value =
    n.getFullYear() + '.' + pad2(n.getMonth()+1) + '.' + pad2(n.getDate());
  document.querySelector('input[name="nbadge"][value="안내"]').checked = true;
  document.getElementById('notice-modal').classList.add('open');
  setTimeout(function(){ document.getElementById('notice-input').focus(); }, 100);
}

function closeNoticeModal(){
  document.getElementById('notice-modal').classList.remove('open');
}

function saveNotice(){
  var text = document.getElementById('notice-input').value.trim();
  if (!text){ document.getElementById('notice-input').focus(); return; }
  var notices = getNotices();
  notices.unshift({
    badge: document.querySelector('input[name="nbadge"]:checked').value,
    text: text,
    date: document.getElementById('notice-date-input').value.trim()
  });
  try { localStorage.setItem('notices', JSON.stringify(notices)); } catch(e){}
  renderNotices();
  closeNoticeModal();
}

document.getElementById('notice-modal').addEventListener('click', function(e){
  if (e.target === this) closeNoticeModal();
});

renderNotices();
loadNotices();
setInterval(loadNotices, 60 * 60 * 1000);

/* =====================================================
   4. 하단 티커 (공지 + 중식)
   ===================================================== */
function renderTicker(){
  var track = document.getElementById('ticker-track');
  if (!track) return;
  var parts = getNotices().slice(0,5).map(function(n){
    return '<span class="ticker-item">📌 ' + n.text + '</span>';
  });
  [['lunch','🍱 오늘 중식'], ['dinner','🍚 오늘 석식']].forEach(function(pair){
    var els = document.querySelectorAll('#' + pair[0] + '-grid .meal-item');
    if (!els.length) return;
    var menus = [];
    for (var i = 0; i < els.length; i++) menus.push(els[i].textContent.trim());
    parts.push('<span class="ticker-item">' + pair[1] + ': ' + menus.join(' · ') + '</span>');
  });
  if (!parts.length){ track.innerHTML = ''; return; }
  var sep = '<span class="ticker-sep">·</span>';
  var one = parts.join(sep);
  track.innerHTML = one + sep + one;
}

/* =====================================================
   5. D-Day
   ===================================================== */
var DDAY_DEFAULT = {
  main: { name:'2027학년도 수능', date:'2026-11-19' },
  subs: [
    { name:'1학기 중간고사', date:'' },
    { name:'5월 학력평가',   date:'' },
    { name:'6월 학력평가',   date:'' }
  ]
};

function getDdayData(){
  try {
    var s = localStorage.getItem('dday_data');
    return s ? JSON.parse(s) : DDAY_DEFAULT;
  } catch(e){ return DDAY_DEFAULT; }
}

function applyDday(data){
  var s = calcD(data.main.date);
  if (s === 'D-Day'){
    document.getElementById('dday-prefix').textContent = '';
    document.getElementById('dday-num').textContent = 'Day';
  } else if (s) {
    document.getElementById('dday-prefix').textContent = s.charAt(0) === 'D' && s.charAt(1) === '+' ? 'D+' : 'D-';
    document.getElementById('dday-num').textContent = s.replace(/^D[-+]/, '');
  }
  document.getElementById('dday-event-name').textContent = data.main.name || '';
  if (data.main.date){
    var d = new Date(data.main.date + 'T00:00:00');
    document.getElementById('dday-date-display').textContent =
      d.getFullYear() + '. ' + pad2(d.getMonth()+1) + '. ' + pad2(d.getDate()) + ' (' + WD[d.getDay()] + ')';
  }
  for (var i = 0; i < 3; i++){
    var sub = data.subs[i] || { name:'', date:'' };
    document.getElementById('sub' + (i+1) + '-name').textContent = sub.name || '-';
    document.getElementById('sub' + (i+1) + '-count').textContent = sub.date ? calcD(sub.date) : '-';
  }
}

function loadDday(){
  fetchCSV(DDAY_CSV).then(function(rows){
    var list = [];
    for (var i = 1; i < rows.length; i++){
      var c = rows[i];
      if (c[0] && c[1]) list.push({ name: c[0], date: normDate(c[1]) });
    }
    if (!list.length) return;
    var data = {
      main: list[0],
      subs: [ list[1] || {name:'',date:''}, list[2] || {name:'',date:''}, list[3] || {name:'',date:''} ]
    };
    try { localStorage.setItem('dday_data', JSON.stringify(data)); } catch(e){}
    applyDday(data);
  }).catch(function(){});
}

function openDdayModal(){
  var data = getDdayData();
  document.getElementById('dm-name').value = data.main.name || '';
  document.getElementById('dm-date').value = data.main.date || '';
  for (var i = 0; i < 3; i++){
    var sub = data.subs[i] || { name:'', date:'' };
    document.getElementById('ds' + (i+1) + '-name').value = sub.name || '';
    document.getElementById('ds' + (i+1) + '-date').value = sub.date || '';
  }
  refreshDdayPreviews();
  document.getElementById('dday-modal').classList.add('open');
}

function closeDdayModal(){
  document.getElementById('dday-modal').classList.remove('open');
}

function refreshDdayPreviews(){
  document.getElementById('dm-preview').textContent = calcD(document.getElementById('dm-date').value);
  for (var i = 1; i <= 3; i++){
    var v = document.getElementById('ds' + i + '-date').value;
    document.getElementById('ds' + i + '-preview').textContent = v ? calcD(v) : '';
  }
}

function saveDday(){
  var subs = [];
  for (var i = 1; i <= 3; i++){
    subs.push({
      name: document.getElementById('ds' + i + '-name').value.trim(),
      date: document.getElementById('ds' + i + '-date').value
    });
  }
  var data = {
    main: {
      name: document.getElementById('dm-name').value.trim() || '수능',
      date: document.getElementById('dm-date').value
    },
    subs: subs
  };
  try { localStorage.setItem('dday_data', JSON.stringify(data)); } catch(e){}
  applyDday(data);
  closeDdayModal();
}

['dm-date','ds1-date','ds2-date','ds3-date'].forEach(function(id){
  document.getElementById(id).addEventListener('change', refreshDdayPreviews);
});
document.getElementById('dday-modal').addEventListener('click', function(e){
  if (e.target === this) closeDdayModal();
});

applyDday(getDdayData());
loadDday();
setInterval(loadDday, 60 * 60 * 1000);

/* =====================================================

  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function dateLabel(s){
  var d = new Date(s + 'T00:00:00');
  return (d.getMonth()+1) + '/' + d.getDate() + ' (' + WD[d.getDay()] + ')';
}

function renderSchedule(){
  var start = offsetDateStr(scheduleOffset);
  var end   = offsetDateStr(scheduleOffset + 6);
  var body  = document.getElementById('schedule-body');

  var sd = new Date(start + 'T00:00:00'), ed = new Date(end + 'T00:00:00');
  document.getElementById('range-info').textContent =
    (sd.getMonth()+1) + '/' + sd.getDate() + ' ~ ' + (ed.getMonth()+1) + '/' + ed.getDate();
  document.getElementById('schedule-today-info').textContent = '오늘: ' + dateLabel(todayStr());

  var filtered = SCHEDULE_DATA.filter(function(it){
    return it.d >= start && it.d <= end && (activeFilter === 'all' || it.c === activeFilter);
  });

  if (!filtered.length){
    body.innerHTML = '<div class="no-schedule"><div class="no-schedule-icon">📭</div>'
      + '<div class="no-schedule-text">해당 기간에 일정이 없습니다</div></div>';
    return;
  }

  var groups = {};
  filtered.forEach(function(it){
    if (!groups[it.d]) groups[it.d] = [];
    groups[it.d].push(it);
  });

  var out = '';
  Object.keys(groups).sort().forEach(function(date){
    var items = groups[date];
    var isToday = (date === todayStr());
    out += '<div class="day-group"><div class="day-header">'
      + '<span class="day-label' + (isToday ? ' today-label' : '') + '">' + dateLabel(date)
      + (isToday ? '<span class="today-badge">TODAY</span>' : '') + '</span>'
      + '<span class="day-count">' + items.length + '건</span>'
      + '<div class="day-divider"></div></div>';
    out += '<div class="sched-items">';
    items.forEach(function(it){
      var detail = it.p + (it.t ? ' · ' + it.t : '');
      out += '<div class="sched-item" data-cat="' + it.c + '">'
        + '<span class="sched-cat" data-cat="' + it.c + '">' + it.c + '</span>'
        + '<div class="sched-info"><div class="sched-univ">' + it.u + '</div>'
        + (detail ? '<div class="sched-detail">' + detail + '</div>' : '')
        + '</div></div>';
    });
    out += '</div></div>';
  });
  body.innerHTML = out;
}

function changeRange(delta){
  scheduleOffset += delta;
  renderSchedule();
}

function toggleFilter(cat){
  activeFilter = cat;
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++){
    if (btns[i].getAttribute('data-cat') === cat) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
  renderSchedule();
}

renderSchedule();
setInterval(function(){ if (scheduleOffset === 0) renderSchedule(); }, 60 * 60 * 1000);

/* =====================================================
   7. 자동 새로고침 (GitHub Pages 반영용)
   ===================================================== */
(function(){
  var lastTag = '';
  function check(){
    fetch(location.origin + location.pathname + '?_=' + Date.now(), {
      method: 'HEAD', cache: 'no-store'
    }).then(function(res){
      var tag = res.headers.get('etag') || res.headers.get('last-modified') || '';
      if (lastTag && tag && lastTag !== tag) location.reload();
      lastTag = tag;
    }).catch(function(){});
  }
  setTimeout(check, 3000);
  setInterval(check, 3 * 60 * 1000);
})();
</script>
